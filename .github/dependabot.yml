version: 2
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"

  # PHP (plugin dev tooling)
  - package-ecosystem: "composer"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "php"
    groups:
      composer:
        update-types:
          - "minor"
          - "patch"

  # PHP (end-to-end test harness)
  - package-ecosystem: "composer"
    cooldown:
      default-days: 7
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "php"
    groups:
      composer:
        update-types:
          - "minor"
          - "patch"

  # JavaScript build tooling
  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/"
    # Revisit when use-memo-one supports React 19 and all lint plugins support ESLint 10.
    # Minor/patch version updates to the supported majors remain enabled.
    ignore:
      - dependency-name: "react"
        versions: ["19.x"]
      - dependency-name: "react-dom"
        versions: ["19.x"]
      - dependency-name: "eslint"
        versions: ["10.x"]
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm:
        update-types:
          - "minor"
          - "patch"

  # Compose stack
  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        update-types:
          - "minor"
          - "patch"

  # End-to-end test image
  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/tests/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        update-types:
          - "minor"
          - "patch"
