name: Generate SBOM

on:
  push:
    branches: [main, develop]
    paths:
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sbom-php:
    name: Generate PHP SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate CycloneDX SBOM (JSON)
        run: composer sbom

      - name: Generate CycloneDX SBOM (XML)
        run: composer sbom:xml

      - name: Run security audit
        run: composer security:audit
        continue-on-error: true

      - name: Upload PHP SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-php
          path: |
            sbom.cdx.json
            sbom.cdx.xml
            security-audit.json
          retention-days: 90


  sbom-npm:
    name: Generate npm SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM (JSON)
        run: npm run sbom

      - name: Generate CycloneDX SBOM (XML)
        run: npm run sbom:xml

      - name: Run security audit
        run: npm run security:audit
        continue-on-error: true

      - name: Upload npm SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-npm
          path: |
            sbom.npm.cdx.json
            sbom.npm.cdx.xml
            security-audit.npm.json
          retention-days: 90

  combine-sboms:
    name: Combine SBOMs
    permissions:
      contents: write
    needs: [sbom-php, sbom-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'release'
    steps:
      - name: Download PHP SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: sbom-php
          path: sboms/php

      - name: Download npm SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: sbom-npm
          path: sboms/npm

      - name: Create combined SBOM package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-sbom
          cp sboms/php/*.json release-sbom/
          cp sboms/php/*.xml release-sbom/
          cp sboms/npm/*.json release-sbom/
          cp sboms/npm/*.xml release-sbom/
          cd release-sbom && zip -r "../sbom-${RELEASE_TAG}.zip" .

      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: sbom-${{ github.ref_name }}.zip
